services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medstock}
      POSTGRES_DB: ${POSTGRES_DB:-medstock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medstock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medstock} -d ${POSTGRES_DB:-medstock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medstock_postgres:
